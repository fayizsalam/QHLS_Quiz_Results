<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QHLS Weekly Quiz Results</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&family=Cormorant+Garamond:wght@600;700&family=Playfair+Display:ital,wght@0,600;1,600&family=Noto+Naskh+Arabic&family=Noto+Sans+Malayalam:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #FFFDF7; }
        .font-arabic-style { font-family: 'Noto Naskh Arabic', serif; }
        .font-malayalam { font-family: 'Noto Sans Malayalam', sans-serif; }
        .font-title { font-family: 'Cormorant Garamond', serif; }
        .font-winners { font-family: 'Playfair Display', serif; }
        
        .text-forest-green {
            background: linear-gradient(135deg, #14532D 0%, #15803D 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        @keyframes shine {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        .text-emerald-shimmer {
            background: linear-gradient(90deg, #15803D 0%, #22C55E 50%, #15803D 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 3s linear infinite;
        }

        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }
    </style>
</head>
<body class="min-h-screen text-slate-900 overflow-x-hidden">

    <canvas id="bgCanvas"></canvas>

    <header class="py-8 px-4 text-center">
        <div class="max-w-2xl mx-auto">
            <div class="flex flex-col items-center -mb-6">
                <img src="https://github.com/fayizsalam/QHLS_Quiz_Results/blob/main/QHLS_LOGO_CHUNKAM_UNIT.png?raw=true" 
                     onerror="this.style.display='none'" 
                     alt="QHLS Logo" 
                     class="h-[350px] md:h-[250px] lg:h-[300px] w-[750px] opacity-90 drop-shadow-md">
            </div>
            
            <h1 class="text-3xl md:text-3xl font-bold text-royal-blue tracking-tight mb-5 font-title">Weekly Online Quiz Results</h1>
            <!-- <h2 class="text-xl md:text-3xl font-bold text-stone-600 mb-6 font-arabic-style">Weekly Online Quiz Results</h2> -->
            
            <div class="flex flex-wrap items-center justify-center gap-x-4 gap-y-2 px-6 py-3 bg-white/50 backdrop-blur-md border border-stone-200 shadow-sm rounded-3xl text-center">
                <div class="flex items-center gap-2">
                    <span class="text-xl">🎓</span>
                    <span class="font-semibold text-stone-700 whitespace-nowrap">ക്ലാസ് -</span>
                    <span class="text-4xl font-black text-emerald-700 px-1">4</span>
                </div>
                <div class="hidden sm:block text-stone-300">|</div>
                <div class="flex items-center gap-2">
                    <span class="text-emerald-800 font-bold font-malayalam text-1xl sm:text-2xl whitespace-nowrap">📖 സൂറത്തുല്‍ മുഅ്മിനൂന്‍</span>
                </div>
            </div>
        </div>
    </header>

    <div id="announcementPage" class="hidden px-4 mb-16">
        <div class="max-w-xl mx-auto bg-white/70 backdrop-blur-lg p-8 md:p-12 rounded-[28px] shadow-sm border border-stone-200 text-center">
            <div class="text-5xl mb-6">📢</div>
            <div class="text-2xl text-emerald-900 font-arabic-style mb-6">السلام عليكم ورحمة الله وبركاته</div>
            <p class="text-lg text-stone-600 mb-6 font-malayalam">ഈ ആഴ്ചയിലെ ക്വിസ് ഫലം ചൊവ്വാഴ്ച (28/7/2026) പ്രസിദ്ധീകരിക്കുന്നതാണ്.</p>
            <!-- <p class="text-sm text-stone-400 italic mb-6">Please visit again tomorrow.</p> -->
            <div class="text-2xl text-emerald-800 font-arabic-style">إِنْ شَاءَ ٱللَّٰهُ</div>
        </div>
        <footer class="mt-12 text-center text-stone-400 text-sm">
            <div>© 2026 QHLS</div>
        </footer>
    </div>

    <main id="resultsPage" class="max-w-2xl mx-auto px-4 pb-16">
        <div class="text-center mb-5 mt-2">
            <h2 class="font-winners text-emerald-shimmer text-6xl md:text-7xl pb-2">Winners</h2>
        </div>

        <div id="resultsGrid" class="grid grid-cols-1 gap-4 max-w-sm mx-auto">
            <div class="bg-white/50 backdrop-blur-md rounded-[28px] shadow-sm border border-stone-200 p-12 text-center">
                <div class="flex flex-col items-center justify-center gap-3">
                    <div class="w-8 h-8 border-4 border-emerald-600 border-t-transparent rounded-full animate-spin"></div>
                    <span class="font-medium text-stone-600">Loading results...</span>
                </div>
            </div>
        </div>

        <div class="text-center mt-12 mb-8">
            <h3 class="text-5xl font-bold text-emerald-900/80 font-winners tracking-wide italic">بارك الله فيكم</h3>
        </div>
        
        <footer class="mt-12 text-center text-stone-400 text-sm">
            <div>© 2026 QHLS</div>
        </footer>
    </main>

    <script>
        const resultsPublished = false; 
        const announcementPage = document.getElementById("announcementPage");
        const resultsPage = document.getElementById("resultsPage");

        if (resultsPublished) {
            announcementPage.classList.add('hidden');
            resultsPage.classList.remove('hidden');
        } else {
            announcementPage.classList.remove('hidden');
            resultsPage.classList.add('hidden');
        }

        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 4 + 1; 
                this.speedY = Math.random() * 0.3 + 0.1;
                this.speedX = (Math.random() - 0.5) * 0.1;
                this.opacity = Math.random() * 0.1 + 0.03;
            }
            update() {
                this.y -= this.speedY;
                this.x += this.speedX;
                if (this.y < -10) this.reset();
            }
            draw() {
                ctx.fillStyle = `rgba(21, 128, 61, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        for (let i = 0; i < 60; i++) particles.push(new Particle());

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }
        animate();

        const csvURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSX727T4ALUYfY-rKR4LdqvKWGZ-TuOiO_98FyaGjf_DirjYIi2awK4ymr_vRJ81U0HusrmG3E4kw73/pub?gid=685099871&single=true&output=csv";
        const resultsGrid = document.querySelector("#resultsGrid");

        fetch(csvURL)
            .then(res => res.text())
            .then(data => {
                const rows = data.trim().split("\n");
                let results = rows.slice(1).map(row => {
                    const cols = row.split(',').map(cell => cell.replace(/^"|"$/g, '').trim());
                    return {
                        name: cols[1],
                        wing: cols[2],
                        score: parseInt(cols[3]) || 0
                    };
                }).filter(item => item.name);

                results.sort((a, b) => b.score - a.score);

                let html = "";
                results.forEach((item, index) => {
                    html += `
                        <div class="bg-white/70 backdrop-blur-md p-5 rounded-[28px] shadow-sm border border-stone-200 flex items-center gap-4 hover:shadow-md transition-all duration-300">
                            <div class="flex-shrink-0 w-8 text-emerald-700 font-semibold text-sm text-left">#${index + 1}</div>
                            <div class="flex-grow flex flex-col items-center justify-center text-center">
                                <h3 class="font-bold text-stone-900 text-lg">${item.name}</h3>
                                <p class="text-sm text-stone-600 font-medium">${item.wing}</p>
                            </div>
                            <div class="w-8"></div>
                        </div>
                    `;
                });
                resultsGrid.innerHTML = html;
            })
            .catch(err => {
                resultsGrid.innerHTML = '<div class="bg-white/50 rounded-[28px] p-8 text-center text-red-600 shadow-sm border border-stone-200">Failed to load data. Please check connection.</div>';
                console.error("Error fetching CSV:", err);
            });
    </script>
</body>
</html>
