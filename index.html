<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QHLS Weekly Quiz Results</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Malayalam:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-breath { font-family: 'Great Vibes', cursive; }
        .font-arabic-style { font-family: 'Amiri', serif; }
        .font-malayalam { font-family: 'Noto Sans Malayalam', sans-serif; }
        
        .text-royal-sky {
            background: linear-gradient(135deg, #0369a1 0%, #075985 50%, #0c4a6e 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0px 2px 2px rgba(12, 74, 110, 0.2));
        }

        .text-sky-shimmer {
            background: linear-gradient(90deg, #38bdf8 0%, #0284c7 50%, #38bdf8 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 3s linear infinite;
        }

        @keyframes shine {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-sky-50 via-white to-blue-50 min-h-screen text-slate-800 overflow-x-hidden">

    <canvas id="bgCanvas"></canvas>

    <header class="py-12 px-4 text-center">
        <div class="max-w-2xl mx-auto">
            <h1 class="text-6xl md:text-7xl font-bold text-royal-sky tracking-tight mb-2 font-arabic-style">QHLS</h1>
            <h2 class="text-xl md:text-2xl font-bold text-slate-600 mb-6 font-arabic-style">Weekly Online Quiz Results</h2>
            
            <div class="flex flex-wrap items-center justify-center gap-x-4 gap-y-2 px-6 py-3 bg-white/80 backdrop-blur-md border border-sky-100 shadow-sm rounded-2xl text-center">
                <div class="flex items-center gap-2">
                    <span class="text-xl">🎓</span>
                    <span class="font-semibold text-slate-700 whitespace-nowrap">ക്ലാസ് -</span>
                    <span class="text-4xl font-black text-sky-700 px-1">4</span>
                </div>
                <div class="hidden sm:block text-slate-700">|</div>
                <div class="flex items-center gap-2">
                    <span class="text-slate-700 font-bold font-malayalam text-1xl sm:text-2xl whitespace-nowrap">📖 സൂറത്തുല്‍ മുഅ്മിനൂന്‍</span>
                </div>
            </div>
        </div>
    </header>

    <div id="announcementPage" class="hidden px-4 mb-16">
        <div class="max-w-xl mx-auto bg-white/80 backdrop-blur-md p-8 rounded-3xl shadow-sm border border-sky-100 text-center">
            <div class="text-5xl mb-6">📢</div>
            <p class="text-lg text-slate-700 mb-6 font-malayalam">ഈ ആഴ്ചയിലെ ക്വിസ് ഫലം ചൊവ്വാഴ്ച (28/7/2026) പ്രസിദ്ധീകരിക്കുന്നതാണ്.</p>
        </div>
    </div>

    <main id="resultsPage" class="max-w-2xl mx-auto px-4 pb-16">
        <div class="text-center mb-5 mt-2">
            <h2 class="font-breath text-sky-shimmer text-6xl md:text-7xl pb-2">Winners</h2>
        </div>

        <div id="resultsGrid" class="grid grid-cols-1 gap-4 max-w-sm mx-auto">
            <div class="bg-white/80 backdrop-blur-md rounded-3xl shadow-sm border border-sky-100 p-12 text-center">
                <div class="flex flex-col items-center justify-center gap-3">
                    <div class="w-8 h-8 border-4 border-sky-600 border-t-transparent rounded-full animate-spin"></div>
                    <span class="font-medium text-slate-600">Loading results...</span>
                </div>
            </div>
        </div>
    </main>

    <script>
        const resultsPublished = true; 
        const announcementPage = document.getElementById("announcementPage");
        const resultsPage = document.getElementById("resultsPage");

        if (resultsPublished) {
            announcementPage.classList.add('hidden');
            resultsPage.classList.remove('hidden');
        } else {
            announcementPage.classList.remove('hidden');
            resultsPage.classList.add('hidden');
        }

        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 3 + 1; 
                this.speedY = Math.random() * 0.2 + 0.1;
                this.opacity = Math.random() * 0.2 + 0.05;
            }
            update() {
                this.y -= this.speedY;
                if (this.y < -10) this.reset();
            }
            draw() {
                ctx.fillStyle = `rgba(14, 165, 233, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        for (let i = 0; i < 50; i++) particles.push(new Particle());

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
